<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MO2 연동 목업</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; background: #141414; color: #e6e6e6; font: 14px/1.6 "Segoe UI", "Malgun Gothic", sans-serif; }
  main { max-width: 1480px; margin: 0 auto; padding: 24px 16px 60px; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  p.lead { color: #9a9a9a; margin: 0 0 24px; }
  figure { margin: 0 0 36px; }
  figcaption { margin: 0 0 10px; }
  figcaption b { color: #e8a838; margin-right: 6px; }
  figcaption span { color: #a8a8a8; }
  img { width: 100%; height: auto; border: 1px solid #2a2a2a; border-radius: 10px; display: block; }
</style>
</head>
<body>
<main>
  <h1>OAR External Tool — MO2 프로필 연동 목업</h1>
  <p class="lead">실제 앱 화면(Fablerim mods, Default 프로필)에 새 요소만 얹어 캡처했습니다. 도구는 modlist.txt를 읽기만 하고 고치지 않습니다.</p>
  <figure><figcaption><b>1</b>전체 보기 — <span>프로필 상자(59 of 89 on), On/All 전환, 꺼진 모드는 흐리게 + off 표시</span></figcaption><img src="shots/all.png" alt=""></figure>
  <figure><figcaption><b>2</b>프로필 메뉴 — <span>ModOrganizer.ini의 프로필 목록, 다시 읽기, MO2 무시</span></figcaption><img src="shots/menu.png" alt=""></figure>
  <figure><figcaption><b>3</b>On만 보기 — <span>MO2에서 켠 모드만 목록에 남음</span></figcaption><img src="shots/onlyon.png" alt=""></figure>
  <figure><figcaption><b>4</b>꺼진 모드를 열었을 때 — <span>안내 띠 + "Off in MO2" 칩, 편집·저장은 그대로 가능</span></figcaption><img src="shots/offmod.png" alt=""></figure>
  <figure><figcaption><b>5a</b>지금 앱 — <span>꺼진 Kyoshin 모드 2개 때문에 "더 높은 우선순위" 경고가 뜸</span></figcaption><img src="shots/panel-now.png" alt=""></figure>
  <figure><figcaption><b>5b</b>MO2 연동 후 — <span>꺼진 모드는 off로 표시만 하고 경고에서 뺌</span></figcaption><img src="shots/panel.png" alt=""></figure>
</main>
</body>
</html>
